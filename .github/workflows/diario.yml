name: Simulacion diaria

on:
  schedule:
    # De lunes a viernes a las 22:30 UTC, con todas las bolsas cerradas
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: simulacion
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar Kronos (IA para el stop)
        continue-on-error: true
        run: |
          git clone https://github.com/shiyu-coder/Kronos kronos_src
          git -C kronos_src checkout 67b630e
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install einops huggingface_hub safetensors tqdm
      - name: Guardar el modelo entre ejecuciones
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1
      - run: python ejecutar.py diario
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add estado docs universos
          git diff --cached --quiet || git commit -m "Simulacion $(date -u +%F)"
          git pull --rebase --autostash
          git push
