name: Calibrar semaforo

on:
  push:
    branches: [semaforo]
    paths: ["experimentos/**", "bolsa/**", "config.py", ".github/workflows/semaforo.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semaforo
  cancel-in-progress: true

jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python experimentos/semaforo.py docs/semaforo
      - name: Guardar resultados
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add docs/semaforo
          git diff --cached --quiet || git commit -m "Calibracion semaforo"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
