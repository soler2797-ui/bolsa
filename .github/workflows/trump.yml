name: Precios prueba Trump
on:
  push:
    branches: [prueba-trump]
    paths: [trump/tickers.txt, trump/descargar.py, .github/workflows/trump.yml]
permissions:
  contents: write
jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=1.0" pandas
      - run: python trump/descargar.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add trump/precios.csv.gz
          git commit -m "Precios para la prueba de copiar compras de Trump"
          git push
