name: Buscar senales

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Inicio (AAAA-MM-DD)"
        default: "2015-01-01"
        required: true
      hasta:
        description: "Fin; lo posterior queda para comprobar"
        default: "2021-12-31"
        required: true

permissions:
  contents: write

concurrency:
  group: simulacion
  cancel-in-progress: false

jobs:
  senales:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ejecutar.py senales --desde ${{ github.event.inputs.desde }} --hasta ${{ github.event.inputs.hasta }} --carpeta docs/senales
      - name: Guardar resultados
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add docs/senales
          git diff --cached --quiet || git commit -m "Senales ${{ github.event.inputs.desde }} / ${{ github.event.inputs.hasta }}"
          git pull --rebase --autostash
          git push
