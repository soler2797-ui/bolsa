name: Kronos control ampliado

on:
  push:
    branches: [kronos-oos-b]
    paths: ["experimentos/kronos_control.py", ".github/workflows/kronos_control.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python experimentos/kronos_control.py 50
      - name: Guardar resultados
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add docs/kronos_oos
          git diff --cached --quiet || git commit -m "Kronos control ampliado"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
