name: Backtest

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha de inicio (AAAA-MM-DD)"
        default: "2016-01-01"
        required: true
      hasta:
        description: "Fecha final (vacío = hoy)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: simulacion
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar backtest
        run: |
          ARGS="--desde ${{ github.event.inputs.desde }} --carpeta docs/backtest"
          if [ -n "${{ github.event.inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ github.event.inputs.hasta }}"; fi
          python ejecutar.py backtest $ARGS
          mv docs/backtest/informe.html docs/backtest/index.html
          rm -f docs/backtest/estado.json
      - name: Guardar resultados
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add docs/backtest
          git diff --cached --quiet || git commit -m "Backtest desde ${{ github.event.inputs.desde }}"
          git pull --rebase --autostash
          git push
