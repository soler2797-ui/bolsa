name: Optimizar parametros

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Inicio del periodo 1 (AAAA-MM-DD)"
        default: "2015-01-01"
        required: true
      corte:
        description: "Fin del periodo 1 e inicio del periodo 2"
        default: "2021-12-31"
        required: true

permissions:
  contents: write

concurrency:
  group: simulacion
  cancel-in-progress: false

jobs:
  optimizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ejecutar.py optimizar --desde ${{ github.event.inputs.desde }} --corte ${{ github.event.inputs.corte }} --carpeta docs/optimizacion
      - name: Guardar resultados
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add docs/optimizacion
          git diff --cached --quiet || git commit -m "Optimizacion ${{ github.event.inputs.desde }} / ${{ github.event.inputs.corte }}"
          git pull --rebase --autostash
          git push
