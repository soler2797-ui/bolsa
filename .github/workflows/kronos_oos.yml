name: Kronos fuera de muestra

on:
  push:
    branches: [kronos-oos]
    paths: ["experimentos/kronos_oos.py", ".github/workflows/kronos_oos.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kronos-oos
  cancel-in-progress: true

jobs:
  prever:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Instalar Kronos
        run: |
          git clone https://github.com/shiyu-coder/Kronos kronos_src
          git -C kronos_src checkout 67b630e
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install einops huggingface_hub safetensors tqdm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-small-v1
      - run: python experimentos/kronos_oos.py prever --parte ${{ matrix.parte }} --partes 4
      - uses: actions/upload-artifact@v4
        with:
          name: previsiones-${{ matrix.parte }}
          path: docs/kronos_oos/previsiones_${{ matrix.parte }}.csv

  evaluar:
    needs: prever
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: previsiones-*
          path: docs/kronos_oos
          merge-multiple: true
      - run: python experimentos/kronos_oos.py evaluar
      - name: Guardar resultados
        run: |
          git config user.name "simulador-bot"
          git config user.email "simulador-bot@users.noreply.github.com"
          git add docs/kronos_oos
          git diff --cached --quiet || git commit -m "Kronos fuera de muestra"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
